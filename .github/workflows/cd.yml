name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Use gcloud CLI setup and authenticate to gcp
        run: gcloud info

      - name: Build and push Docker image to Artifact Registry
        run: |
          gcloud builds submit \
            --tag asia-south1-docker.pkg.dev/notely-506907/notely-ar-repo/notely:latest .

      - name: Deploy to Google Cloud Run
        run: |
          gcloud run deploy notely \
            --image asia-south1-docker.pkg.dev/notely-506907/notely-ar-repo/notely:latest \
            --region asia-south1 \
            --allow-unauthenticated \
            --project notely-506907 \
            --max-instances=4
